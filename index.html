    <!--
      ไอคอน Material Symbols — โหลดเฉพาะตัวที่ใช้จริง 27 ตัวผ่าน icon_names

      ไอคอนถึงจะขึ้น = หน้าจอค้างขาวตอนเปิดครั้งแรก ชุดที่ตัดแล้วเหลือหลักสิบ KB
      แก้รายการไอคอน = ต้องแก้ที่ icon_names ตรงนี้ด้วย ไม่งั้นจะขึ้นเป็นข้อความแทนรูป
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=account_balance,account_balance_wallet,account_circle,add,backup,bar_chart,category,cloud_off,delete_sweep,edit_note,error,history,info,logout,menu,notifications,payments,pending_actions,savings,schedule,science,settings,space_dashboard,storefront,upload_file,visibility,visibility_off&display=block"
